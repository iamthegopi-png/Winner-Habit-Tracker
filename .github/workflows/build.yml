name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Configure Alpha Studio v6 Titanium Project, 3D Crest & Dual Widgets
        run: |
          mkdir -p app/src/main/java/com/vibrant/habittracker
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          LATEST_CORE=$(git log --format="" --name-only | grep "HabitTrackerCore.kt" | head -n 1)
          if [ -z "$LATEST_CORE" ]; then
            LATEST_CORE=$(find . -name "HabitTrackerCore.kt" | head -n 1)
          fi
          if [ -n "$LATEST_CORE" ] && [ -f "$LATEST_CORE" ] && [ "$LATEST_CORE" != "app/src/main/java/com/vibrant/habittracker/HabitTrackerCore.kt" ] && [ "$LATEST_CORE" != "./app/src/main/java/com/vibrant/habittracker/HabitTrackerCore.kt" ]; then
            cp "$LATEST_CORE" app/src/main/java/com/vibrant/habittracker/HabitTrackerCore.kt
          fi

          LATEST_MAIN=$(git log --format="" --name-only | grep "MainActivity.kt" | head -n 1)
          if [ -z "$LATEST_MAIN" ]; then
            LATEST_MAIN=$(find . -name "MainActivity.kt" | head -n 1)
          fi
          if [ -n "$LATEST_MAIN" ] && [ -f "$LATEST_MAIN" ] && [ "$LATEST_MAIN" != "app/src/main/java/com/vibrant/habittracker/MainActivity.kt" ] && [ "$LATEST_MAIN" != "./app/src/main/java/com/vibrant/habittracker/MainActivity.kt" ]; then
            cp "$LATEST_MAIN" app/src/main/java/com/vibrant/habittracker/MainActivity.kt
          fi

          find . -maxdepth 2 -name "HabitTrackerCore.kt" -delete || true
          find . -maxdepth 2 -name "MainActivity.kt" -delete || true

          # 1. Create gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          # 2. Create settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AlphaHabitStudio"
          include(":app")
          EOF

          # 3. Create root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          # 4. Create app/build.gradle.kts (Release-Optimized for Zero Lag & Low Battery)
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.vibrant.habittracker"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.vibrant.habittracker"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 6
                  versionName = "6.0.0-StudioTitanium"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isDebuggable = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2025.02.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("io.coil-kt:coil-compose:2.7.0")
          }
          EOF

          # 5. STUDIO-GRADE 3D METALLIC ALPHA APEX LAUNCHER ICON
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FF05070C"
                  android:pathData="M0,0h108v108h-108z"/>
              <!-- Subtle obsidian diagonal sheen -->
              <path
                  android:fillColor="#FF0D1422"
                  android:pathData="M0,0 L108,0 L0,108 Z"/>
              <!-- Soft central radial glow -->
              <path
                  android:fillColor="#1A38BDF8"
                  android:pathData="M54,14 L94,54 L54,94 L14,54 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Outer Dark Titanium Octagon Plate -->
              <path
                  android:pathData="M54,18 L82,32 L86,62 L54,88 L22,62 L26,32 Z"
                  android:fillColor="#FF111827"
                  android:strokeWidth="2.8"
                  android:strokeColor="#FF38BDF8"
                  android:strokeLineJoin="round"/>
              <!-- Left 3D Bevel Shadow Facet -->
              <path
                  android:pathData="M54,18 L26,32 L22,62 L54,88 L54,54 Z"
                  android:fillColor="#22FFFFFF"/>
              <!-- Sculpted Platinum Alpha Apex Left Wing -->
              <path
                  android:pathData="M54,28 L33,74 L43,74 L54,47 Z"
                  android:fillColor="#FFF8FAFC"/>
              <!-- Sculpted Brushed-Steel Alpha Apex Right Wing -->
              <path
                  android:pathData="M54,28 L75,74 L65,74 L54,47 Z"
                  android:fillColor="#FFCBD5E1"/>
              <!-- High-Energy Emerald-Cyan Core Strike Crossbar -->
              <path
                  android:pathData="M34,62 L54,52 L54,60 L74,50"
                  android:strokeWidth="4.2"
                  android:strokeColor="#FF34D399"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:fillColor="#00000000"/>
              <!-- Apex Crown Specular Spark -->
              <path
                  android:pathData="M54,23 L57,28 L54,32 L51,28 Z"
                  android:fillColor="#FFFBBF24"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # 6. Widget Drawables & Layouts
          cat << 'EOF' > app/src/main/res/drawable/widget_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#F40B0F19"/>
              <corners android:radius="22dp"/>
              <stroke android:width="1.5dp" android:color="#FF28354A"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/widget_btn_done.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#FF34D399"/>
              <corners android:radius="10dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/widget_btn_pending.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#FF1E2738"/>
              <corners android:radius="10dp"/>
              <stroke android:width="1dp" android:color="#FF34D399"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/layout/habit_widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout android:background="@drawable/widget_bg" android:id="@+id/widget_root" android:layout_height="match_parent" android:layout_width="match_parent" android:orientation="vertical" android:padding="14dp" xmlns:android="http://schemas.android.com/apk/res/android">

              <LinearLayout android:gravity="center_vertical" android:layout_height="wrap_content" android:layout_width="match_parent" android:orientation="horizontal">
                  <TextView android:id="@+id/widget_header_title" android:layout_height="wrap_content" android:layout_weight="1" android:layout_width="0dp" android:text="⚡ ALPHA HABITS" android:textColor="#FFF8FAFC" android:textSize="13sp" android:textStyle="bold"/>
                  <TextView android:id="@+id/widget_header_score" android:layout_height="wrap_content" android:layout_width="wrap_content" android:text="0/0 Done" android:textColor="#FF34D399" android:textSize="12sp" android:textStyle="bold"/>
              </LinearLayout>

              <TextView android:id="@+id/widget_subtitle" android:layout_height="wrap_content" android:layout_width="match_parent" android:paddingBottom="6dp" android:text="Complete daily disciplines to evolve your Sentinel" android:textColor="#FF94A3B8" android:textSize="10sp"/>

              <LinearLayout android:gravity="center_vertical" android:id="@+id/widget_row_1" android:layout_height="wrap_content" android:layout_width="match_parent" android:orientation="horizontal" android:paddingBottom="4dp" android:paddingTop="4dp">
                  <TextView android:id="@+id/widget_title_1" android:layout_height="wrap_content" android:layout_weight="1" android:layout_width="0dp" android:singleLine="true" android:textColor="#FFF8FAFC" android:textSize="13sp"/>
                  <TextView android:background="@drawable/widget_btn_pending" android:gravity="center" android:id="@+id/widget_btn_1" android:layout_height="30dp" android:layout_width="34dp" android:text="✓" android:textColor="#FF34D399" android:textSize="14sp" android:textStyle="bold"/>
              </LinearLayout>
              <LinearLayout android:gravity="center_vertical" android:id="@+id/widget_row_2" android:layout_height="wrap_content" android:layout_width="match_parent" android:orientation="horizontal" android:paddingBottom="4dp" android:paddingTop="4dp">
                  <TextView android:id="@+id/widget_title_2" android:layout_height="wrap_content" android:layout_weight="1" android:layout_width="0dp" android:singleLine="true" android:textColor="#FFF8FAFC" android:textSize="13sp"/>
                  <TextView android:background="@drawable/widget_btn_pending" android:gravity="center" android:id="@+id/widget_btn_2" android:layout_height="30dp" android:layout_width="34dp" android:text="✓" android:textColor="#FF34D399" android:textSize="14sp" android:textStyle="bold"/>
              </LinearLayout>
              <LinearLayout android:gravity="center_vertical" android:id="@+id/widget_row_3" android:layout_height="wrap_content" android:layout_width="match_parent" android:orientation="horizontal" android:paddingBottom="4dp" android:paddingTop="4dp">
                  <TextView android:id="@+id/widget_title_3" android:layout_height="wrap_content" android:layout_weight="1" android:layout_width="0dp" android:singleLine="true" android:textColor="#FFF8FAFC" android:textSize="13sp"/>
                  <TextView android:background="@drawable/widget_btn_pending" android:gravity="center" android:id="@+id/widget_btn_3" android:layout_height="30dp" android:layout_width="34dp" android:text="✓" android:textColor="#FF34D399" android:textSize="14sp" android:textStyle="bold"/>
              </LinearLayout>
              <LinearLayout android:gravity="center_vertical" android:id="@+id/widget_row_4" android:layout_height="wrap_content" android:layout_width="match_parent" android:orientation="horizontal" android:paddingBottom="4dp" android:paddingTop="4dp">
                  <TextView android:id="@+id/widget_title_4" android:layout_height="wrap_content" android:layout_weight="1" android:layout_width="0dp" android:singleLine="true" android:textColor="#FFF8FAFC" android:textSize="13sp"/>
                  <TextView android:background="@drawable/widget_btn_pending" android:gravity="center" android:id="@+id/widget_btn_4" android:layout_height="30dp" android:layout_width="34dp" android:text="✓" android:textColor="#FF34D399" android:textSize="14sp" android:textStyle="bold"/>
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/task_widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout android:background="@drawable/widget_bg" android:id="@+id/task_widget_root" android:layout_height="match_parent" android:layout_width="match_parent" android:orientation="vertical" android:padding="14dp" xmlns:android="http://schemas.android.com/apk/res/android">

              <LinearLayout android:gravity="center_vertical" android:layout_height="wrap_content" android:layout_width="match_parent" android:orientation="horizontal">
                  <TextView android:id="@+id/task_widget_header_title" android:layout_height="wrap_content" android:layout_weight="1" android:layout_width="0dp" android:text="🎯 ALPHA MISSIONS" android:textColor="#FFF8FAFC" android:textSize="13sp" android:textStyle="bold"/>
                  <TextView android:id="@+id/task_widget_header_score" android:layout_height="wrap_content" android:layout_width="wrap_content" android:text="0 Pending" android:textColor="#FFFBBF24" android:textSize="12sp" android:textStyle="bold"/>
              </LinearLayout>

              <TextView android:id="@+id/task_widget_subtitle" android:layout_height="wrap_content" android:layout_width="match_parent" android:paddingBottom="6dp" android:text="Check off priority tasks directly from your home screen" android:textColor="#FF94A3B8" android:textSize="10sp"/>

              <LinearLayout android:gravity="center_vertical" android:id="@+id/task_widget_row_1" android:layout_height="wrap_content" android:layout_width="match_parent" android:orientation="horizontal" android:paddingBottom="4dp" android:paddingTop="4dp">
                  <TextView android:id="@+id/task_widget_title_1" android:layout_height="wrap_content" android:layout_weight="1" android:layout_width="0dp" android:singleLine="true" android:textColor="#FFF8FAFC" android:textSize="13sp"/>
                  <TextView android:background="@drawable/widget_btn_pending" android:gravity="center" android:id="@+id/task_widget_btn_1" android:layout_height="30dp" android:layout_width="34dp" android:text="✓" android:textColor="#FF34D399" android:textSize="14sp" android:textStyle="bold"/>
              </LinearLayout>
              <LinearLayout android:gravity="center_vertical" android:id="@+id/task_widget_row_2" android:layout_height="wrap_content" android:layout_width="match_parent" android:orientation="horizontal" android:paddingBottom="4dp" android:paddingTop="4dp">
                  <TextView android:id="@+id/task_widget_title_2" android:layout_height="wrap_content" android:layout_weight="1" android:layout_width="0dp" android:singleLine="true" android:textColor="#FFF8FAFC" android:textSize="13sp"/>
                  <TextView android:background="@drawable/widget_btn_pending" android:gravity="center" android:id="@+id/task_widget_btn_2" android:layout_height="30dp" android:layout_width="34dp" android:text="✓" android:textColor="#FF34D399" android:textSize="14sp" android:textStyle="bold"/>
              </LinearLayout>
              <LinearLayout android:gravity="center_vertical" android:id="@+id/task_widget_row_3" android:layout_height="wrap_content" android:layout_width="match_parent" android:orientation="horizontal" android:paddingBottom="4dp" android:paddingTop="4dp">
                  <TextView android:id="@+id/task_widget_title_3" android:layout_height="wrap_content" android:layout_weight="1" android:layout_width="0dp" android:singleLine="true" android:textColor="#FFF8FAFC" android:textSize="13sp"/>
                  <TextView android:background="@drawable/widget_btn_pending" android:gravity="center" android:id="@+id/task_widget_btn_3" android:layout_height="30dp" android:layout_width="34dp" android:text="✓" android:textColor="#FF34D399" android:textSize="14sp" android:textStyle="bold"/>
              </LinearLayout>
              <LinearLayout android:gravity="center_vertical" android:id="@+id/task_widget_row_4" android:layout_height="wrap_content" android:layout_width="match_parent" android:orientation="horizontal" android:paddingBottom="4dp" android:paddingTop="4dp">
                  <TextView android:id="@+id/task_widget_title_4" android:layout_height="wrap_content" android:layout_weight="1" android:layout_width="0dp" android:singleLine="true" android:textColor="#FFF8FAFC" android:textSize="13sp"/>
                  <TextView android:background="@drawable/widget_btn_pending" android:gravity="center" android:id="@+id/task_widget_btn_4" android:layout_height="30dp" android:layout_width="34dp" android:text="✓" android:textColor="#FF34D399" android:textSize="14sp" android:textStyle="bold"/>
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/xml/habit_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:initialLayout="@layout/habit_widget_layout"
              android:minWidth="250dp"
              android:minHeight="140dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="1800000"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/task_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:initialLayout="@layout/task_widget_layout"
              android:minWidth="250dp"
              android:minHeight="140dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="1800000"
              android:widgetCategory="home_screen" />
          EOF

          # 7. Create AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="ALPHA Studio"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".MotivationReminderReceiver"
                      android:enabled="true"
                      android:exported="false" />

                  <receiver
                      android:name=".BootAndAlarmRescheduleReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.TIME_SET" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                          <action android:name="android.app.action.SCHEDULE_EXACT_ALARM_PERMISSION_STATE_CHANGED" />
                      </intent-filter>
                  </receiver>

                  <receiver
                      android:name=".HabitWidgetProvider"
                      android:exported="true"
                      android:label="⚡ Alpha Habits Widget">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.vibrant.habittracker.ACTION_WIDGET_TOGGLE_HABIT" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/habit_widget_info" />
                  </receiver>

                  <receiver
                      android:name=".TaskWidgetProvider"
                      android:exported="true"
                      android:label="🎯 Alpha Missions Widget">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.vibrant.habittracker.ACTION_WIDGET_TOGGLE_TASK" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/task_widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Fast Release-Optimized APK
        run: gradle assembleRelease --console=plain

      - name: Upload Optimized APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaStudio-v6-Titanium-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

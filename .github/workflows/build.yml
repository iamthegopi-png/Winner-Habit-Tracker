name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Configure Studio Project, Icons & Widgets
        run: |
          mkdir -p app/src/main/java/com/vibrant/habittracker
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # Always pick the most recently committed HabitTrackerCore.kt and MainActivity.kt
          LATEST_CORE=$(git log --format="" --name-only | grep "HabitTrackerCore.kt" | head -n 1)
          if [ -z "$LATEST_CORE" ]; then
            LATEST_CORE=$(find . -name "HabitTrackerCore.kt" | head -n 1)
          fi
          if [ -n "$LATEST_CORE" ] && [ -f "$LATEST_CORE" ] && [ "$LATEST_CORE" != "app/src/main/java/com/vibrant/habittracker/HabitTrackerCore.kt" ] && [ "$LATEST_CORE" != "./app/src/main/java/com/vibrant/habittracker/HabitTrackerCore.kt" ]; then
            cp "$LATEST_CORE" app/src/main/java/com/vibrant/habittracker/HabitTrackerCore.kt
          fi

          LATEST_MAIN=$(git log --format="" --name-only | grep "MainActivity.kt" | head -n 1)
          if [ -z "$LATEST_MAIN" ]; then
            LATEST_MAIN=$(find . -name "MainActivity.kt" | head -n 1)
          fi
          if [ -n "$LATEST_MAIN" ] && [ -f "$LATEST_MAIN" ] && [ "$LATEST_MAIN" != "app/src/main/java/com/vibrant/habittracker/MainActivity.kt" ] && [ "$LATEST_MAIN" != "./app/src/main/java/com/vibrant/habittracker/MainActivity.kt" ]; then
            cp "$LATEST_MAIN" app/src/main/java/com/vibrant/habittracker/MainActivity.kt
          fi

          # Remove any stray duplicate .kt files outside app/src/main/java/com/vibrant/habittracker
          find . -maxdepth 2 -name "HabitTrackerCore.kt" -delete || true
          find . -maxdepth 2 -name "MainActivity.kt" -delete || true

          # 1. Create gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          # 2. Create settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WinnerHabitTracker"
          include(":app")
          EOF

          # 3. Create root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("com.android.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          # 4. Create app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.vibrant.habittracker"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.vibrant.habittracker"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "3.0.0-Studio"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2025.02.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("io.coil-kt:coil-compose:2.7.0")
          }
          EOF

          # 5. Create Custom Adaptive App Icon Vectors
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#FF070B14"/>
                          <item android:offset="0.5" android:color="#FF10192B"/>
                          <item android:offset="1.0" android:color="#FF062822"/>
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:pathData="M54,24 A30,30 0 1,1 53.9,24 Z"
                  android:strokeWidth="4.5"
                  android:fillColor="#00000000">
                  <aapt:attr name="android:strokeColor">
                      <gradient
                          android:startX="24"
                          android:startY="24"
                          android:endX="84"
                          android:endY="84"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#FF34D399"/>
                          <item android:offset="0.5" android:color="#FF06B6D4"/>
                          <item android:offset="1.0" android:color="#FFA855F7"/>
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:pathData="M54,30 L68,50 L54,78 L40,50 Z"
                  android:fillColor="#3334D399"/>
              <path
                  android:pathData="M43,54 L51,62 L67,44"
                  android:strokeWidth="6"
                  android:strokeCap="round"
                  android:strokeJoin="round"
                  android:strokeColor="#FF34D399"
                  android:fillColor="#00000000"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # 6. Create Home Screen Widget Resources
          cat << 'EOF' > app/src/main/res/drawable/widget_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#F20F141E"/>
              <corners android:radius="22dp"/>
              <stroke android:width="1.5dp" android:color="#FF28354A"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/widget_btn_done.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#FF34D399"/>
              <corners android:radius="10dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/widget_btn_pending.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#FF1E2738"/>
              <corners android:radius="10dp"/>
              <stroke android:width="1dp" android:color="#FF34D399"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/layout/habit_widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg"
              android:orientation="vertical"
              android:padding="14dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal">

                  <TextView
                      android:id="@+id/widget_header_title"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="💎 Zenith Habit Studio"
                      android:textColor="#FFF8FAFC"
                      android:textSize="14sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/widget_header_score"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="0/0 Done"
                      android:textColor="#FF34D399"
                      android:textSize="12sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <TextView
                  android:id="@+id/widget_subtitle"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:paddingBottom="8dp"
                  android:text="Tap ✓ to complete directly from home screen"
                  android:textColor="#FF94A3B8"
                  android:textSize="10sp" />

              <LinearLayout
                  android:id="@+id/widget_row_1"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingVertical="4dp">
                  <TextView
                      android:id="@+id/widget_title_1"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:singleLine="true"
                      android:textColor="#FFF8FAFC"
                      android:textSize="13sp" />
                  <TextView
                      android:id="@+id/widget_btn_1"
                      android:layout_width="34dp"
                      android:layout_height="30dp"
                      android:background="@drawable/widget_btn_pending"
                      android:gravity="center"
                      android:text="✓"
                      android:textColor="#FF34D399"
                      android:textSize="14sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/widget_row_2"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingVertical="4dp">
                  <TextView
                      android:id="@+id/widget_title_2"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:singleLine="true"
                      android:textColor="#FFF8FAFC"
                      android:textSize="13sp" />
                  <TextView
                      android:id="@+id/widget_btn_2"
                      android:layout_width="34dp"
                      android:layout_height="30dp"
                      android:background="@drawable/widget_btn_pending"
                      android:gravity="center"
                      android:text="✓"
                      android:textColor="#FF34D399"
                      android:textSize="14sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/widget_row_3"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingVertical="4dp">
                  <TextView
                      android:id="@+id/widget_title_3"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:singleLine="true"
                      android:textColor="#FFF8FAFC"
                      android:textSize="13sp" />
                  <TextView
                      android:id="@+id/widget_btn_3"
                      android:layout_width="34dp"
                      android:layout_height="30dp"
                      android:background="@drawable/widget_btn_pending"
                      android:gravity="center"
                      android:text="✓"
                      android:textColor="#FF34D399"
                      android:textSize="14sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/widget_row_4"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingVertical="4dp">
                  <TextView
                      android:id="@+id/widget_title_4"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:singleLine="true"
                      android:textColor="#FFF8FAFC"
                      android:textSize="13sp" />
                  <TextView
                      android:id="@+id/widget_btn_4"
                      android:layout_width="34dp"
                      android:layout_height="30dp"
                      android:background="@drawable/widget_btn_pending"
                      android:gravity="center"
                      android:text="✓"
                      android:textColor="#FF34D399"
                      android:textSize="14sp"
                      android:textStyle="bold" />
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/xml/habit_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:initialLayout="@layout/habit_widget_layout"
              android:minWidth="250dp"
              android:minHeight="140dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="1800000"
              android:widgetCategory="home_screen" />
          EOF

          # 7. Create AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Zenith Habit Studio"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".MotivationReminderReceiver"
                      android:exported="false" />

                  <receiver
                      android:name=".HabitWidgetProvider"
                      android:exported="true"
                      android:label="Zenith Habit Checklist">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.vibrant.habittracker.ACTION_WIDGET_TOGGLE_HABIT" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/habit_widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --console=plain

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinnerHabitTracker-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

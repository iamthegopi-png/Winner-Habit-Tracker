name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Verify & Repair Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/vibrant/habittracker

          # Move Kotlin source files into the package folder if uploaded to root or elsewhere
          CORE_FILE=$(find . -name "HabitTrackerCore.kt" | head -n 1)
          if [ -n "$CORE_FILE" ] && [ "$CORE_FILE" != "./app/src/main/java/com/vibrant/habittracker/HabitTrackerCore.kt" ]; then
            cp "$CORE_FILE" app/src/main/java/com/vibrant/habittracker/HabitTrackerCore.kt
          fi

          MAIN_FILE=$(find . -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_FILE" ] && [ "$MAIN_FILE" != "./app/src/main/java/com/vibrant/habittracker/MainActivity.kt" ]; then
            cp "$MAIN_FILE" app/src/main/java/com/vibrant/habittracker/MainActivity.kt
          fi

          # 1. Create gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          # 2. Create root settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WinnerHabitTracker"
          include(":app")
          EOF

          # 3. Create root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          # 4. Create app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.vibrant.habittracker"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.vibrant.habittracker"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2025.02.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("androidx.credentials:credentials:1.5.0")
              implementation("androidx.credentials:credentials-play-services-auth:1.5.0")
              implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")
          }
          EOF

          # 5. Create app/src/main/AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:label="PulseHabit Pro"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          echo "Verified project files:"
          find app -maxdepth 6

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinnerHabitTracker-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
